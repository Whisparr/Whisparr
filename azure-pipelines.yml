  - stage: Automation
    displayName: '09-Automation'
    dependsOn: Packages

    jobs:
    - job: Automation
      strategy:
        matrix:
          Linux:
            osName: 'Linux'
            artifactName: 'linux-x64'
            imageName: ${{ variables.linuxImage }}
            pattern: 'Whisparr.*.linux-core-x64.tar.gz'
            failBuild: true
          Mac:
            osName: 'Mac'
            artifactName: 'osx-x64'
            imageName: ${{ variables.macImage }}
            pattern: 'Whisparr.*.osx-core-x64.tar.gz'
            failBuild: true
          Windows:
            osName: 'Windows'
            artifactName: 'win-x64'
            imageName: ${{ variables.windowsImage }}
            pattern: 'Whisparr.*.windows-core-x64.zip'
            failBuild: true

      pool:
        vmImage: $(imageName)

      steps:
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - checkout: none
      - task: DownloadPipelineArtifact@2
        displayName: Download Test Artifact
        inputs:
          buildType: 'current'
          artifactName: '$(artifactName)-tests'
          targetPath: $(testsFolder)
      - task: DownloadPipelineArtifact@2
        displayName: Download Build Artifact
        inputs:
          buildType: 'current'
          artifactName: Packages
          itemPattern: '**/$(pattern)'
          targetPath: $(Build.ArtifactStagingDirectory)
      - task: ExtractFiles@1
        inputs:
          archiveFilePatterns: '$(Build.ArtifactStagingDirectory)/**/$(pattern)'
          destinationFolder: '$(Build.ArtifactStagingDirectory)/bin'
        displayName: Extract Package
      - bash: |
          mkdir -p ./bin/
          # Preserve the Whisparr directory layout so UI ends up at ./bin/Whisparr/UI
          cp -r -v ${BUILD_ARTIFACTSTAGINGDIRECTORY}/bin/Whisparr ./bin/
        displayName: Move Package Contents
      - bash: |
          echo "Pre-test diagnostics: listing runtime bin and UI folders"
          echo "Build.ArtifactStagingDirectory = $(Build.ArtifactStagingDirectory)"
          echo "Listing ./bin"
          ls -la ./bin || true
          echo "Listing ./bin/Whisparr (if present)"
          ls -la ./bin/Whisparr || true
          echo "Listing ./bin/Whisparr/UI (if present)"
          ls -la ./bin/Whisparr/UI || true
          echo "Listing _output/UI (frontend artifact)"
          ls -la "$(Build.SourcesDirectory)/_output/UI" || true
          echo "Check for index.html and main JS bundles"
          if [ -f "./bin/Whisparr/UI/index.html" ]; then echo "Found index.html in package UI"; else echo "index.html not found in package UI"; fi
          if [ -f "$(Build.SourcesDirectory)/_output/UI/index.html" ]; then echo "Found index.html in frontend artifact"; else echo "index.html not found in frontend artifact"; fi
          echo "Show sizes for UI files (if present)"
          du -sh ./bin/Whisparr/UI 2>/dev/null || true
          du -sh "$(Build.SourcesDirectory)/_output/UI" 2>/dev/null || true
          echo "--- index.html head (package UI) ---"
          if [ -f "./bin/Whisparr/UI/index.html" ]; then
            head -n 200 ./bin/Whisparr/UI/index.html || true
          else
            echo "No index.html to show"
          fi
          echo "--- referenced scripts and links from index.html ---"
          if [ -f "./bin/Whisparr/UI/index.html" ]; then
            grep -Eo '<script[^>]+src="[^"]+"' ./bin/Whisparr/UI/index.html | sed -E 's/.*src="([^"]+)".*/\1/' | uniq || true
            grep -Eo '<link[^>]+href="[^"]+"' ./bin/Whisparr/UI/index.html | sed -E 's/.*href="([^"]+)".*/\1/' | uniq || true
          fi
          echo "--- check that referenced files exist under ./bin/Whisparr/UI ---"
          if [ -f "./bin/Whisparr/UI/index.html" ]; then
            refs=$(grep -Eo '<script[^>]+src="[^"]+"' ./bin/Whisparr/UI/index.html | sed -E 's/.*src="([^"]+)".*/\1/' | uniq || true)
            for r in $refs; do
              path=./bin/Whisparr/UI/${r#./}
              if [ -f "$path" ]; then
                echo "OK: $r -> $path"
              else
                echo "MISSING: $r -> $path"
              fi
            done
          fi
        displayName: 'Pre-Test: Verify UI files'
      - bash: |
          chmod a+x ${TESTSFOLDER}/test.sh
          ${TESTSFOLDER}/test.sh ${OSNAME} Automation Test
        displayName: Run Automation Tests
      - task: CopyFiles@2
        displayName: 'Copy Screenshot to: $(Build.ArtifactStagingDirectory)'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'
          Contents: |
            **/*_test_screenshot.png
          TargetFolder: '$(Build.ArtifactStagingDirectory)/screenshots'
      - publish: $(Build.ArtifactStagingDirectory)/screenshots
        artifact: '$(osName)AutomationScreenshots'
        displayName: Publish Screenshot Bundle
        condition: and(succeeded(), eq(variables['System.JobAttempt'], '1'))
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'NUnit'
          testResultsFiles: '**/TestResult.xml'
          testRunTitle: '$(osName) Automation Tests'
          failTaskOnFailedTests: $(failBuild)
          failTaskOnMissingResultsFile: $(failBuild)
        displayName: Publish Test Results

  - stage: Report_Out
    displayName: '10-Build Status Report'
    dependsOn:
    - Analyze
    - Installer
    - Unit_Test
    - Integration
    - Automation
    condition: eq(variables['system.pullrequest.isfork'], false)
    jobs:
    - job:
      displayName: Discord Notification
      pool:
        vmImage: ${{ variables.linuxImage }}
      steps:
        - task: DownloadPipelineArtifact@2
          continueOnError: true
          displayName: Download Screenshot Artifact
          inputs:
            buildType: 'current'
            artifactName: 'WindowsAutomationScreenshots'
            targetPath: $(Build.SourcesDirectory)
        - checkout: none
        - pwsh: |
            iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/Servarr/AzureDiscordNotify/master/DiscordNotify.ps1'))
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            DISCORDCHANNELID: $(discordChannelId)
            DISCORDWEBHOOKKEY: $(discordWebhookKey)
            DISCORDTHREADID: 1191571521781649499