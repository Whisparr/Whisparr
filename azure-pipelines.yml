          artifactName: backend-osx-arm64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/osx-arm64
      - bash: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf _output
          mkdir -p _output
          for dir in $(Build.ArtifactStagingDirectory)/backend/*; do
            if [ -d "$dir/_output" ]; then
              rsync -a "$dir/_output/" _output/
            fi
          done
          rm -rf _output/UI
        displayName: Assemble Backend Payloads
      - bash: |
