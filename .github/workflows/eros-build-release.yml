name: Eros cross-release from in-repo build
description: >
  Build and create a GitHub Release for Eros across all supported platforms
  using a GitHub Actions workflow. This workflow builds the backend and frontend,
  creates packages, builds Windows installers, and creates a GitHub Release with
  the generated assets.  It is intended to be temporary, until eros is moved to its own repo.

on:
  push:
    branches:
      - fake
    paths-ignore:
      - "src/Whisparr.Api.*/openapi.json"
  pull_request:
    branches:
      - fake
    paths-ignore:
      - "src/NzbDrone.Core/Localization/Core/**"
      - "src/Whisparr.Api.*/openapi.json"

env:
  FRAMEWORK: net10.0
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  WHISPARR_MAJOR_VERSION: 3
  VERSION: 3.1.0
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.variables.outputs.framework }}
      major_version: ${{ steps.variables.outputs.major_version }}
      version: ${{ steps.variables.outputs.version }}
      branch: ${{ steps.variables.outputs.branch }}
    steps:
      - name: Setup Environment Variables
        id: variables
        shell: bash
        run: |
          echo "framework=${{ env.FRAMEWORK }}" >> "$GITHUB_OUTPUT"
          echo "major_version=${{ env.Whisparr_MAJOR_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ env.VERSION }}.$((${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "branch=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"

  backend:
    name: Build Backend (${{ matrix.runtime }})
    runs-on: 'ubuntu-22.04'
    needs: prepare
    env:
      TAG: ${{ needs.resolve-ref.outputs.tag }}
      WHISPARRVERSION: ${{ needs.resolve-ref.outputs.whisparr }}
      BUILD_ID: ${{ needs.resolve-ref.outputs.build_id }}
      MAJORVERSION: ${{ needs.resolve-ref.outputs.majorversion }}
      MINORVERSION: ${{ needs.resolve-ref.outputs.minorversion }}
    strategy:
      matrix:
        runtime: [
          'win-x64', 'win-x86', 'linux-x64', 'linux-musl-x64', 'linux-arm64',
          'linux-musl-arm64', 'linux-arm', 'linux-musl-arm', 'osx-x64', 'osx-arm64'
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Build backend
        uses: ./.github/actions/build
        with:
          branch: ${{ needs.resolve-ref.outputs.checkout_ref }}
          version: ${{ needs.resolve-ref.outputs.whisparr }}
          framework: 'net10.0'
          runtime: ${{ matrix.runtime }}
          package_tests: 'false'

  frontend:
    name: Build Frontend
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Volta
        uses: volta-cli/action@v4

      - name: Yarn Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint -f github

      - name: Build
        run: yarn build --env production

      - name: Publish UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build_ui
          path: _output/UI/**/*

  deploy:
    if: ${{ github.ref_name == 'v3-develop-final' || github.ref_name == 'v3-main-final' }}
    needs:
      [
        prepare,
        backend,
        frontend,
      ]
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
    with:
      framework: ${{ needs.prepare.outputs.framework }}
      branch: ${{ github.ref_name }}
      major_version: ${{ needs.prepare.outputs.major_version }}
      version: ${{ needs.prepare.outputs.version }}

  create_release:
    name: Create GitHub Release and upload assets
    runs-on: 'ubuntu-22.04'
    needs: deploy
    env:
      TAG: ${{ needs.resolve-ref.outputs.tag }}
      WHISPARRVERSION: ${{ needs.resolve-ref.outputs.whisparr }}
      BUILD_ID: ${{ needs.resolve-ref.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: release_assets

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: release_assets

      - name: Download Windows installers artifact
        uses: actions/download-artifact@v4
        with:
          name: WindowsInstallers
          path: release_assets

      - name: Set release tag output from resolve-ref
        id: tag_info
        run: |
          echo "tag=${{ needs.resolve-ref.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "build_id=${{ needs.resolve-ref.outputs.build_id }}" >> $GITHUB_OUTPUT

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.tag }}
          body: Automated release created from build ${{ steps.tag_info.outputs.build_id }}
          draft: false
          generateReleaseNotes: true
          prerelease: true
          artifacts: release_assets/**
          token: ${{ secrets.GITHUB_TOKEN }}
