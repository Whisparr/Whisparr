name: Mint GitHub App installation token
description: >
  Mint a GitHub App installation token for the current repository using
  the provided App ID and private key.

on:
  workflow_call:
    secrets:
      CI_APP_ID:
        required: true
      CI_APP_KEY:
        required: true

jobs:
  mint:
    runs-on: ubuntu-latest
    outputs:
      release_token: ${{ steps.export.outputs.release_token }}
      installation_id: ${{ steps.export.outputs.installation_id }}
    steps:
      - name: Generate installation token
        id: create
        env:
          CI_APP_ID: ${{ secrets.CI_APP_ID }}
          CI_APP_KEY: ${{ secrets.CI_APP_KEY }}
        run: |
          set -euo pipefail
          # Decode private key
          echo "$CI_APP_KEY" | base64 --decode > /tmp/app_private_key.pem

          # Install minimal Python deps
          python -m pip install --upgrade pip
          python -m pip install PyJWT requests

          # Create JWT, exchange for installation token, and emit outputs
          python3 .github/scripts/mint_app_token.py

      - name: Mask and export token (no printing)
        id: export
        run: |
          set -euo pipefail
          # RELEASE_TOKEN and INSTALLATION_ID should be set in the job environment
          # by writing to $GITHUB_ENV inside the script. Do NOT print the token.
          if [ -z "${RELEASE_TOKEN-}" ]; then
            echo "RELEASE_TOKEN is not set; aborting" >&2
            exit 1
          fi

          # Mask the token so it doesn't appear in logs even if accidentally echoed
          echo "::add-mask::${RELEASE_TOKEN}"

          # Expose as step outputs for consumers that need them (still masked)
          echo "release_token=${RELEASE_TOKEN}" >> $GITHUB_OUTPUT
          echo "installation_id=${INSTALLATION_ID-}" >> $GITHUB_OUTPUT

          # Cleanup sensitive artifacts
          rm -f /tmp/app_private_key.pem || true
