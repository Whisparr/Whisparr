            -e POSTGRES_USER=whisparr \
            -p 5432:5432/tcp \
            -v /usr/share/zoneinfo/America/Chicago:/etc/localtime:ro \
            postgres:15
          displayName: Start postgres
        - bash: |
            chmod a+x ${TESTSFOLDER}/test.sh
            ${TESTSFOLDER}/test.sh Linux Integration Test
          displayName: Run Integration Tests
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'NUnit'
            testResultsFiles: '**/TestResult.xml'
            testRunTitle: 'Integration LinuxCore Postgres15 Database Integration Tests'
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
          displayName: Publish Test Results

    - job: Integration_FreeBSD
      displayName: FreeBSD
      dependsOn: Prepare
      condition: and(succeeded(), eq(dependencies.Prepare.outputs['setVar.backendNotUpdated'], '0'))
      workspace:
        clean: all
      variables:
        backendArtifact: 'backend-freebsd-x64'
        runtime: 'freebsd-x64'
      pool:
        name: 'FreeBSD'

      steps:
      - checkout: none
      - task: DownloadPipelineArtifact@2
        displayName: Download Test Artifact
        inputs:
          buildType: 'current'
          artifactName: 'freebsd-x64-tests'
          targetPath: $(testsFolder)
      - task: DownloadPipelineArtifact@2
        displayName: Download Backend Artifact
        inputs:
          buildType: 'current'
          artifactName: $(backendArtifact)
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend
      - bash: |
          set -euo pipefail
          rm -rf ./bin
          mkdir -p ./bin
          PUBLISH_ROOT="${BUILD_ARTIFACTSTAGINGDIRECTORY}/backend/_output/net6.0/$(runtime)/publish"
          if [ ! -d "$PUBLISH_ROOT" ]; then
            echo "Publish directory not found: $PUBLISH_ROOT"
            exit 1
          fi
          cp -r -v "${PUBLISH_ROOT}/." ./bin/
          for target in Whisparr Whisparr.Update Whisparr.Console Whisparr.Mono ServiceInstall ServiceUninstall ffprobe ffmpeg mediainfo; do
            if [ -f "./bin/${target}" ]; then
              chmod +x "./bin/${target}"
            fi
          done
        displayName: Stage Backend Payload
      - bash: |
          chmod a+x ${TESTSFOLDER}/test.sh
          ${TESTSFOLDER}/test.sh Linux Integration Test
        displayName: Run Integration Tests
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'NUnit'
          testResultsFiles: '**/TestResult.xml'
          testRunTitle: 'FreeBSD Integration Tests'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: false
        displayName: Publish Test Results

    - job: Integration_Docker
      displayName: Docker
      dependsOn: Prepare
      condition: and(succeeded(), eq(dependencies.Prepare.outputs['setVar.backendNotUpdated'], '0'))
      strategy:
        matrix:
          alpine:
            testName: 'linux-musl-x64'
            artifactName: linux-musl-x64-tests
            containerImage: ghcr.io/servarr/testimages:alpine
            backendArtifact: 'backend-linux-musl-x64'
            runtime: 'linux-musl-x64'
      pool:
        vmImage: ${{ variables.linuxImage }}

      container: $[ variables['containerImage'] ]

      timeoutInMinutes: 15

      steps:
      - task: UseDotNet@2
        displayName: 'Install .NET'
        inputs:
          version: $(dotnetVersion)
      - checkout: none
      - task: DownloadPipelineArtifact@2
        displayName: Download Test Artifact
        inputs:
          buildType: 'current'
          artifactName: $(artifactName)
          targetPath: $(testsFolder)
      - task: DownloadPipelineArtifact@2
        displayName: Download Backend Artifact
        inputs:
          buildType: 'current'
          artifactName: $(backendArtifact)
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend
      - bash: |
          set -euo pipefail
          rm -rf ./bin
          mkdir -p ./bin
          PUBLISH_ROOT="${BUILD_ARTIFACTSTAGINGDIRECTORY}/backend/_output/net6.0/$(runtime)/publish"
          if [ ! -d "$PUBLISH_ROOT" ]; then
            echo "Publish directory not found: $PUBLISH_ROOT"
            exit 1
          fi
          cp -r -v "${PUBLISH_ROOT}/." ./bin/
          for target in Whisparr Whisparr.Update Whisparr.Console Whisparr.Mono ServiceInstall ServiceUninstall ffprobe ffmpeg mediainfo; do
            if [ -f "./bin/${target}" ]; then
              chmod +x "./bin/${target}"
            fi
          done
        displayName: Stage Backend Payload
      - bash: |
          chmod a+x ${TESTSFOLDER}/test.sh
          ${TESTSFOLDER}/test.sh Linux Integration Test
        displayName: Run Integration Tests
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'NUnit'
          testResultsFiles: '**/TestResult.xml'
          testRunTitle: '$(testName) Integration Tests'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
        displayName: Publish Test Results

  - stage: Automation
    displayName: Automation
    dependsOn: Packages

    jobs:
    - job: Automation
      displayName: Tests
      strategy:
        matrix:
          Linux:
            osName: 'Linux'
            artifactName: 'linux-x64'
            runtime: 'linux-x64'
            imageName: ${{ variables.linuxImage }}
            backendArtifact: 'backend-linux-x64'
            failBuild: true
          Mac:
            osName: 'Mac'
            artifactName: 'osx-x64'
            runtime: 'osx-x64'
            imageName: ${{ variables.macImage }}
            backendArtifact: 'backend-osx-x64'
            failBuild: true
          Windows:
            osName: 'Windows'
            artifactName: 'win-x64'
            runtime: 'win-x64'
            imageName: ${{ variables.windowsImage }}
            backendArtifact: 'backend-win-x64'
            failBuild: true

      pool:
        vmImage: $(imageName)

      steps:
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - checkout: none
      - task: DownloadPipelineArtifact@2
        displayName: Download Test Artifact
        inputs:
          buildType: 'current'
          artifactName: '$(artifactName)-tests'
          targetPath: $(testsFolder)
      - task: DownloadPipelineArtifact@2
        displayName: Download Backend Artifact
        inputs:
          buildType: 'current'
          artifactName: $(backendArtifact)
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend
      - bash: |
          set -euo pipefail
          rm -rf ./bin
          mkdir -p ./bin
          PUBLISH_ROOT="${BUILD_ARTIFACTSTAGINGDIRECTORY}/backend/_output/net6.0/$(runtime)/publish"
          if [ ! -d "$PUBLISH_ROOT" ]; then
            echo "Publish directory not found: $PUBLISH_ROOT"
            exit 1
          fi
          cp -r -v "${PUBLISH_ROOT}/." ./bin/
          for target in Whisparr Whisparr.Update Whisparr.Console Whisparr.Mono ServiceInstall ServiceUninstall ffprobe ffmpeg mediainfo; do
            if [ -f "./bin/${target}" ]; then
              chmod +x "./bin/${target}"
            fi
          done
        displayName: Stage Backend Payload
      - task: DownloadPipelineArtifact@2
        displayName: Download Frontend Artifact
        inputs:
          buildType: 'current'
          artifactName: 'Frontend'
          targetPath: $(Build.ArtifactStagingDirectory)/frontend
      - bash: |
          set -euo pipefail
          FRONTEND_ROOT="$(Build.ArtifactStagingDirectory)/frontend/UI"
          if [ ! -d "$FRONTEND_ROOT" ]; then
            echo "Frontend UI not found at $FRONTEND_ROOT"
            exit 1
          fi
          rm -rf ./bin/UI
          mkdir -p ./bin/UI
          cp -a "$FRONTEND_ROOT/." ./bin/UI/
        displayName: Stage Frontend Payload
      - bash: |
          chmod a+x ${TESTSFOLDER}/test.sh
          ${TESTSFOLDER}/test.sh ${OSNAME} Automation Test
        displayName: Run Automation Tests
      - pwsh: |
          New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)/screenshots" -Force | Out-Null
        displayName: Prepare Screenshot Artifact Directory
      - task: CopyFiles@2
        displayName: 'Copy Screenshot to: $(Build.ArtifactStagingDirectory)'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'
          Contents: |
            **/*_test_screenshot.png
          TargetFolder: '$(Build.ArtifactStagingDirectory)/screenshots'
      - publish: $(Build.ArtifactStagingDirectory)/screenshots
        artifact: '$(osName)AutomationScreenshots'
        displayName: Publish Screenshot Bundle
        condition: and(succeeded(), eq(variables['System.JobAttempt'], '1'))
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'NUnit'
          testResultsFiles: '**/TestResult.xml'
          testRunTitle: '$(osName) Automation Tests'
          failTaskOnFailedTests: $(failBuild)
          failTaskOnMissingResultsFile: $(failBuild)
        displayName: Publish Test Results

  - stage: Report_Out
    dependsOn:
    - Analyze
    - Installer
    - Unit_Test
    - Integration
    - Automation
    condition: eq(variables['system.pullrequest.isfork'], false)
    displayName: Build Status Report
    jobs:
    - job:
      displayName: Discord Notification
      pool:
        vmImage: ${{ variables.linuxImage }}
      steps:
        - task: DownloadPipelineArtifact@2
          continueOnError: true
          displayName: Download Screenshot Artifact
          inputs:
            buildType: 'current'
            artifactName: 'WindowsAutomationScreenshots'
            targetPath: $(Build.SourcesDirectory)
        - checkout: none
        - pwsh: |
            iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/Servarr/AzureDiscordNotify/master/DiscordNotify.ps1'))
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            DISCORDCHANNELID: $(discordChannelId)
            DISCORDWEBHOOKKEY: $(discordWebhookKey)
            DISCORDTHREADID: 1191571521781649499

