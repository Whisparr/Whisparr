# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

variables:
  outputFolder: './_output'
  artifactsFolder: './_artifacts'
  testsFolder: './_tests'
  yarnCacheFolder: $(Pipeline.Workspace)/.yarn
  nugetCacheFolder: $(Pipeline.Workspace)/.nuget/packages
  majorVersion: '3.0.2'
  minorVersion: $[counter('minorVersion', 2000)]
  whisparrVersion: '$(majorVersion).$(minorVersion)'
  buildName: '$(Build.SourceBranchName).$(whisparrVersion)'
  sentryOrg: 'servarr'
  sentryUrl: 'https://sentry.servarr.com'
  dotnetVersion: '6.0.427'
  nodeVersion: '20.X'
  innoVersion: '6.2.2'
  windowsImage: 'windows-2022'
  linuxImage: 'ubuntu-22.04'
  macImage: 'macOS-15'

trigger:
  branches:
    include:
    - develop
    - master
    - eros
  paths:
    exclude:
      - .github
      - src/Whisparr.Api.*/openapi.json

pr:
  branches:
    include:
    - develop
    - eros
  paths:
    exclude:
    - .github
    - src/NzbDrone.Core/Localization/Core
    - src/Whisparr.Api.*/openapi.json

stages:
  - stage: Setup
    displayName: Setup
    jobs:
    - job:
      displayName: Build Variables
      pool:
        vmImage: ${{ variables.linuxImage }}
      steps:
      # Set the build name properly.  The 'name' property won't recursively expand so hack here:
      - bash: echo "##vso[build.updatebuildnumber]$WHISPARRVERSION"
        displayName: Set Build Name
      - bash: |
          if [[ $BUILD_REASON == "PullRequest" ]]; then
          git diff origin/develop...HEAD  --name-only | grep -E "^(src/|azure-pipelines.yml)"
          echo $? > not_backend_update
          else
          echo 0 > not_backend_update
          fi
          cat not_backend_update
        displayName: Check for Backend File Changes
      - publish: not_backend_update
        artifact: not_backend_update
        displayName: Publish update type

  - stage: Analyze
    dependsOn:
    - Setup
    displayName: Analyze

    jobs:
    - job: Prepare
      pool:
        vmImage: ${{ variables.linuxImage }}
      steps:
      - checkout: none
      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: 'current'
          artifactName: 'not_backend_update'
          targetPath: '.'
      - bash: echo "##vso[task.setvariable variable=backendNotUpdated;isOutput=true]$(cat not_backend_update)"
        name: setVar

    - job: Lint_Frontend
      displayName: Lint Frontend
      pool:
        vmImage: ${{ variables.windowsImage }}
      steps:
      - task: UseNode@1
        displayName: Set Node.js version
        inputs:
          version: $(nodeVersion)
      - checkout: self
        submodules: true
        fetchDepth: 1
      - task: Cache@2
        inputs:
          key: 'yarn | "Windows" | yarn.lock'
          restoreKeys: |
             yarn | "Windows"
          path: $(yarnCacheFolder)
        displayName: Cache Yarn packages
      - bash: |
          yarn install --frozen-lockfile --network-timeout 120000
        displayName: Install frontend dependencies
        env:
          FORCE_COLOR: 0
          YARN_CACHE_FOLDER: $(yarnCacheFolder)
      - bash: yarn lint
        displayName: Run ESLint
        env:
          FORCE_COLOR: 0
          YARN_CACHE_FOLDER: $(yarnCacheFolder)
      - bash: yarn stylelint-windows
        displayName: Run Stylelint
        env:
          FORCE_COLOR: 0
          YARN_CACHE_FOLDER: $(yarnCacheFolder)

    - job: Api_Docs
      displayName: API Docs
      dependsOn: Prepare
      condition: |
        and
        (
          and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/eros')),
          and(succeeded(), eq(dependencies.Prepare.outputs['setVar.backendNotUpdated'], '0'))
        )

      pool:
        vmImage: ${{ variables.windowsImage }}

      steps:
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - checkout: self
        submodules: true
        persistCredentials: true
        fetchDepth: 1
      - bash: ./docs.sh Windows
        displayName: Create openapi.json
      - bash: |
          git config --global user.email "development@lidarr.audio"
          git config --global user.name "Servarr"
          git checkout -b eros-api-docs
          git add .
          git status
          if git status | grep modified
          then
            git commit -am 'Automated API Docs update'
            git push -f --set-upstream origin eros-api-docs
            curl -X POST -H "Authorization: token ${GITHUBTOKEN}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/whisparr/whisparr/pulls -d '{"head":"eros-api-docs","base":"eros","title":"Update API docs"}'
          else
            echo "No changes since last run"
          fi
        displayName: Commit API Doc Change
        continueOnError: true
        env:
          GITHUBTOKEN: $(githubToken)
      - task: CopyFiles@2
        displayName: 'Copy openapi.json to: $(Build.ArtifactStagingDirectory)'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'
          Contents: |
            **/*openapi.json
          TargetFolder: '$(Build.ArtifactStagingDirectory)/api_docs'
      - publish: $(Build.ArtifactStagingDirectory)/api_docs
        artifact: 'APIDocs'
        displayName: Publish API Docs Bundle
        condition: and(succeeded(), eq(variables['System.JobAttempt'], '1'))

    - job: Analyze_Backend
      displayName: Backend
      dependsOn: Prepare
      condition: and(succeeded(), eq(dependencies.Prepare.outputs['setVar.backendNotUpdated'], '0'))

      variables:
        disable.coverage.autogenerate: 'true'
        EnableAnalyzers: 'false'

      pool:
        vmImage: ${{ variables.windowsImage }}

      steps:
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - checkout: self # Need history for Sonar analysis
        submodules: true
      - powershell: Set-Service SCardSvr -StartupType Manual
        displayName: Enable Windows Test Service
      - bash: |
          ./build.sh --backend -f net6.0 -r win-x64
          TEST_DIR=_tests/net6.0/win-x64/publish/ ./test.sh Windows Unit Coverage
        displayName: Coverage Unit Tests
      - task: reportgenerator@5.3.11
        displayName: Generate Coverage Report
        inputs:
          reports: '$(Build.SourcesDirectory)/CoverageResults/**/coverage.opencover.xml'
          targetdir: '$(Build.SourcesDirectory)/CoverageResults/combined'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura;Badges'
          publishCodeCoverageResults: true

  - stage: Build_Backend
    displayName: Backend
    # Fail fast if setup or linting fail
    dependsOn:
      - Setup
      - Analyze
    jobs:
    - job: Backend_Linux
      displayName: Linux
      pool:
        vmImage: ${{ variables.linuxImage }}
      strategy:
        matrix:
          linux-x64:
            runtime: 'linux-x64'
            framework: 'net6.0'
            includeSharedOutput: 'true'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          linux-musl-x64:
            runtime: 'linux-musl-x64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          linux-arm64:
            runtime: 'linux-arm64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          linux-musl-arm64:
            runtime: 'linux-musl-arm64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          linux-arm:
            runtime: 'linux-arm'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          linux-musl-arm:
            runtime: 'linux-musl-arm'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'false'
            enableExtraPlatformsInSdk: 'false'
          freebsd-x64:
            runtime: 'freebsd-x64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
            enableExtraPlatforms: 'true'
            enableExtraPlatformsInSdk: 'true'
      steps:
      - checkout: self
        submodules: true
        fetchDepth: 1
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - bash: |
          set -euo pipefail
          cp src/Directory.Build.props "$(Pipeline.Workspace)/nuget-cache-key.props"
        displayName: Snapshot NuGet cache key
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | $(Pipeline.Workspace)/nuget-cache-key.props'
          restoreKeys: |
             nuget | "$(Agent.OS)"
          path: $(nugetCacheFolder)
      - bash: |
          BUNDLEDVERSIONS=${AGENT_TOOLSDIRECTORY}/dotnet/sdk/${DOTNETVERSION}/Microsoft.NETCoreSdk.BundledVersions.props
          echo $BUNDLEDVERSIONS
          if grep -q freebsd-x64 $BUNDLEDVERSIONS; then
            echo "Extra platforms already enabled"
          else
            echo "Enabling extra platform support"
            sed -i.ORI 's/osx-x64/osx-x64;freebsd-x64/' "$BUNDLEDVERSIONS"
          fi
        displayName: Enable Extra Platform Support
        condition: eq(variables['enableExtraPlatformsInSdk'], 'true')
      - bash: |
          set -euo pipefail
          extra_args=""
          if [ "$(enableExtraPlatforms)" = "true" ]; then
            extra_args="--enable-extra-platforms"
          fi
          ./build.sh --backend -f $(framework) -r $(runtime) ${extra_args}
        displayName: Build Backend ($(runtime))
        env:
          NUGET_PACKAGES: $(nugetCacheFolder)
      - bash: |
          set -euo pipefail
          STAGING="$(Build.ArtifactStagingDirectory)/backend/$(runtime)"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -a _output "$STAGING/"
          if [ "$(includeSharedOutput)" != "true" ]; then
            rm -rf "$STAGING/_output/UI"
          fi
        displayName: Stage Backend Output
      - publish: '$(Build.ArtifactStagingDirectory)/backend/$(runtime)'
        artifact: 'backend-$(runtime)'
        displayName: Publish Backend Artifact
      - publish: '$(testsFolder)/$(framework)/$(runtime)/publish'
        artifact: '$(runtime)-tests'
        displayName: Publish $(runtime) Test Package

    - job: Backend_Mac
      displayName: macOS
      pool:
        vmImage: ${{ variables.macImage }}
      strategy:
        matrix:
          osx-x64:
            runtime: 'osx-x64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
          osx-arm64:
            runtime: 'osx-arm64'
            framework: 'net6.0'
            includeSharedOutput: 'false'
      steps:
      - checkout: self
        submodules: true
        fetchDepth: 1
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - bash: |
          set -euo pipefail
          cp src/Directory.Build.props "$(Pipeline.Workspace)/nuget-cache-key.props"
        displayName: Snapshot NuGet cache key
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | $(Pipeline.Workspace)/nuget-cache-key.props'
          restoreKeys: |
             nuget | "$(Agent.OS)"
          path: $(nugetCacheFolder)
      - bash: |
          set -euo pipefail
          ./build.sh --backend -f $(framework) -r $(runtime)
        displayName: Build Backend ($(runtime))
        env:
          NUGET_PACKAGES: $(nugetCacheFolder)
      - bash: |
          set -euo pipefail
          STAGING="$(Build.ArtifactStagingDirectory)/backend/$(runtime)"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -a _output "$STAGING/"
          if [ "$(includeSharedOutput)" != "true" ]; then
            rm -rf "$STAGING/_output/UI"
          fi
        displayName: Stage Backend Output
      - publish: '$(Build.ArtifactStagingDirectory)/backend/$(runtime)'
        artifact: 'backend-$(runtime)'
        displayName: Publish Backend Artifact
      - publish: '$(testsFolder)/$(framework)/$(runtime)/publish'
        artifact: '$(runtime)-tests'
        displayName: Publish $(runtime) Test Package

    - job: Backend_Windows
      displayName: Windows
      pool:
        vmImage: ${{ variables.windowsImage }}
      variables:
        framework: 'net6.0'
      steps:
      - checkout: self
        submodules: true
        fetchDepth: 1
      - task: UseDotNet@2
        displayName: 'Install .net core'
        inputs:
          version: $(dotnetVersion)
      - bash: |
          set -euo pipefail
          cp src/Directory.Build.props "$(Pipeline.Workspace)/nuget-cache-key.props"
        displayName: Snapshot NuGet cache key
      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | $(Pipeline.Workspace)/nuget-cache-key.props'
          restoreKeys: |
             nuget | "$(Agent.OS)"
          path: $(nugetCacheFolder)
      - bash: |
          set -euo pipefail

          build_and_stage() {
            local runtime="$1"
            ./build.sh --backend -f $(framework) -r "${runtime}"

            local staging="$(Build.ArtifactStagingDirectory)/backend/${runtime}"
            rm -rf "${staging}"
            mkdir -p "${staging}"
            cp -a _output "${staging}/"
            rm -rf "${staging}/_output/UI"

            local tests_source="$(testsFolder)/$(framework)/${runtime}/publish"
            local tests_target="$(Build.ArtifactStagingDirectory)/tests/${runtime}"
            rm -rf "${tests_target}"
            mkdir -p "${tests_target}"
            if [ -d "${tests_source}" ]; then
              cp -a "${tests_source}/." "${tests_target}/"
            fi
          }

          build_and_stage win-x64
          build_and_stage win-x86
        displayName: Build and Stage Windows Backends
        env:
          NUGET_PACKAGES: $(nugetCacheFolder)
      - publish: '$(Build.ArtifactStagingDirectory)/backend/win-x64'
        artifact: 'backend-win-x64'
        displayName: Publish Backend Artifact (win-x64)
      - publish: '$(Build.ArtifactStagingDirectory)/tests/win-x64'
        artifact: 'win-x64-tests'
        displayName: Publish win-x64 Test Package
      - publish: '$(Build.ArtifactStagingDirectory)/backend/win-x86'
        artifact: 'backend-win-x86'
        displayName: Publish Backend Artifact (win-x86)
      - publish: '$(Build.ArtifactStagingDirectory)/tests/win-x86'
        artifact: 'win-x86-tests'
        displayName: Publish win-x86 Test Package

  - stage: Build_Frontend
    displayName: Frontend
    # Fail fast if setup or linting fail
    dependsOn:
      - Setup
      - Analyze
    jobs:
    - job: Build_Frontend
      displayName: Build Frontend
      pool:
        vmImage: ${{ variables.windowsImage }}
      steps:
      - task: UseNode@1
        displayName: Set Node.js version
        inputs:
          version: $(nodeVersion)
      - checkout: self
        submodules: true
        fetchDepth: 1
      - task: Cache@2
        inputs:
          key: 'yarn | "Windows" | yarn.lock'
          restoreKeys: |
             yarn | "Windows"
          path: $(yarnCacheFolder)
        displayName: Cache Yarn packages
      - bash: ./build.sh --frontend
        displayName: Build Whisparr Frontend
        env:
          FORCE_COLOR: 0
          YARN_CACHE_FOLDER: $(yarnCacheFolder)
      - publish: $(outputFolder)
        artifact: 'Frontend'
        displayName: Publish Frontend

  - stage: Installer
    dependsOn:
    - Build_Backend
    - Build_Frontend
    jobs:
    - job: Windows_Installer
      displayName: Create
      pool:
        vmImage: ${{ variables.windowsImage }}
      steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download backend win-x64
        inputs:
          buildType: 'current'
          artifactName: backend-win-x64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/win-x64
      - task: DownloadPipelineArtifact@2
        displayName: Download backend win-x86
        inputs:
          buildType: 'current'
          artifactName: backend-win-x86
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/win-x86
      - pwsh: |
          $backendRoot = "$(Build.ArtifactStagingDirectory)/backend"
          if (-not (Test-Path $backendRoot)) {
            throw "Backend artifacts not found"
          }
          Remove-Item -Recurse -Force _output -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path _output -Force | Out-Null
          Get-ChildItem -Path $backendRoot -Directory | ForEach-Object {
            $payload = Join-Path $_.FullName '_output'
            if (Test-Path $payload) {
              Get-ChildItem -Path $payload -Force | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination _output -Recurse -Force
              }
            }
          }
          if (Test-Path _output/UI) {
            Remove-Item -Recurse -Force _output/UI
          }
        displayName: Assemble Backend Payloads
      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: 'current'
          artifactName: Frontend
          targetPath: _output
        displayName: Fetch Frontend
      - bash: |
          set -euo pipefail
          ./build.sh --packages -f net6.0 -r win-x64
          ./build.sh --packages -f net6.0 -r win-x86
          ./build.sh --installer
          cp distribution/windows/setup/output/Whisparr.*win-x64.exe ${BUILD_ARTIFACTSTAGINGDIRECTORY}/Whisparr.${BUILDNAME}.windows-core-x64-installer.exe
          cp distribution/windows/setup/output/Whisparr.*win-x86.exe ${BUILD_ARTIFACTSTAGINGDIRECTORY}/Whisparr.${BUILDNAME}.windows-core-x86-installer.exe
        displayName: Create Installers
      - publish: $(Build.ArtifactStagingDirectory)
        artifact: 'WindowsInstaller'
        displayName: Publish Installer

  - stage: Packages
    dependsOn:
    - Build_Backend
    - Build_Frontend
    jobs:
    - job: Linux_Packages
      displayName: Linux
      pool:
        vmImage: ${{ variables.linuxImage }}
      steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-x64
        inputs:
          buildType: 'current'
          artifactName: backend-linux-x64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-x64
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-musl-x64
        inputs:
          buildType: 'current'
          artifactName: backend-linux-musl-x64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-musl-x64
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-arm64
        inputs:
          buildType: 'current'
          artifactName: backend-linux-arm64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-arm64
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-musl-arm64
        inputs:
          buildType: 'current'
          artifactName: backend-linux-musl-arm64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-musl-arm64
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-arm
        inputs:
          buildType: 'current'
          artifactName: backend-linux-arm
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-arm
      - task: DownloadPipelineArtifact@2
        displayName: Download backend linux-musl-arm
        inputs:
          buildType: 'current'
          artifactName: backend-linux-musl-arm
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/linux-musl-arm
      - task: DownloadPipelineArtifact@2
        displayName: Download backend freebsd-x64
        inputs:
          buildType: 'current'
          artifactName: backend-freebsd-x64
          itemPattern: '_output/**'
          targetPath: $(Build.ArtifactStagingDirectory)/backend/freebsd-x64
      - bash: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf _output
          mkdir -p _output
          for dir in $(Build.ArtifactStagingDirectory)/backend/*; do
            if [ -d "$dir/_output" ]; then
              rsync -a "$dir/_output/" _output/
            fi
          done
          rm -rf _output/UI
        displayName: Assemble Backend Payloads
      - bash: |
          set -euo pipefail
          rm -rf "$(Build.ArtifactStagingDirectory)/backend"
        displayName: Cleanup Backend Downloads
      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: 'current'
          artifactName: Frontend
          targetPath: _output
        displayName: Fetch Frontend
      - bash: |
          set -euo pipefail
          runtimes=(
            linux-x64
            linux-musl-x64
            linux-arm
            linux-musl-arm
            linux-arm64
            linux-musl-arm64
            freebsd-x64
          )
          for runtime in "${runtimes[@]}"; do
            ./build.sh --packages -f net6.0 -r "$runtime"
          done
        displayName: Create Linux and FreeBSD Packages
      - bash: |
          set -euo pipefail
          find $(artifactsFolder) -name "ffprobe" -exec chmod a+x {} \;
          find $(artifactsFolder) -name "Whisparr" -exec chmod a+x {} \;
          find $(artifactsFolder) -name "Whisparr.Update" -exec chmod a+x {} \;
        displayName: Set executable bits
      - task: ArchiveFiles@2
        displayName: Create linux-x64 tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-x64.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-x64/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-x64.tar.gz'
        artifact: 'package-linux-core-x64'
        displayName: Publish linux-core-x64 package
      - task: ArchiveFiles@2
        displayName: Create linux-musl-x64 tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-x64.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-musl-x64/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-x64.tar.gz'
        artifact: 'package-linux-musl-core-x64'
        displayName: Publish linux-musl-core-x64 package
      - task: ArchiveFiles@2
        displayName: Create linux-arm tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-arm.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-arm/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-arm.tar.gz'
        artifact: 'package-linux-core-arm'
        displayName: Publish linux-core-arm package
      - task: ArchiveFiles@2
        displayName: Create linux-musl-arm tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-arm.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-musl-arm/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-arm.tar.gz'
        artifact: 'package-linux-musl-core-arm'
        displayName: Publish linux-musl-core-arm package
      - task: ArchiveFiles@2
        displayName: Create linux-arm64 tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-arm64.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-arm64/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-core-arm64.tar.gz'
        artifact: 'package-linux-core-arm64'
        displayName: Publish linux-core-arm64 package
      - task: ArchiveFiles@2
        displayName: Create linux-musl-arm64 tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-arm64.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/linux-musl-arm64/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).linux-musl-core-arm64.tar.gz'
        artifact: 'package-linux-musl-core-arm64'
        displayName: Publish linux-musl-core-arm64 package
      - task: ArchiveFiles@2
        displayName: Create freebsd-x64 tar
        inputs:
          archiveFile: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).freebsd-core-x64.tar.gz'
          archiveType: 'tar'
          tarCompression: 'gz'
          includeRootFolder: false
          rootFolderOrFile: $(artifactsFolder)/freebsd-x64/net6.0
      - publish: '$(Build.ArtifactStagingDirectory)/Whisparr.$(buildName).freebsd-core-x64.tar.gz'
        artifact: 'package-freebsd-core-x64'
        displayName: Publish freebsd-core-x64 package
      - bash: |
          echo "Uploading source maps to sentry"
          curl -sL https://sentry.io/get-cli/ | bash
          RELEASENAME="Whisparr@${WHISPARRVERSION}-${BUILD_SOURCEBRANCHNAME}"
          sentry-cli releases new --finalize -p whisparr -p whisparr-ui -p whisparr-update "${RELEASENAME}"
          sentry-cli releases -p whisparr-ui files "${RELEASENAME}" upload-sourcemaps _output/UI/ --rewrite
          sentry-cli releases set-commits --auto "${RELEASENAME}"
          if [[ ${BUILD_SOURCEBRANCH} == "refs/heads/develop" ]]; then
          sentry-cli releases deploys "${RELEASENAME}" new -e nightly
          else
          sentry-cli releases deploys "${RELEASENAME}" new -e production
          fi
          if [ $? -gt 0 ]; then
            echo "##vso[task.logissue type=warning]Error uploading source maps."
          fi
          exit 0
        displayName: Publish Sentry Source Maps
        condition: |
          or
          (
            and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop')),
            and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
          )
        env:
          SENTRY_AUTH_TOKEN: $(sentryAuthTokenServarr)
          SENTRY_ORG: $(sentryOrg)
          SENTRY_URL: $(sentryUrl)
      - bash: |
          set -euo pipefail
          rm -rf _output _artifacts
        displayName: Cleanup Package Workspace
